<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<style>
text{font-family:"Microsoft YaHei",SimHei,sans-serif}
.t-title{font-size:18px;font-weight:bold;fill:#23272B}
.t-main{font-size:17px;font-weight:bold;fill:#23272B}
.t-mainw{font-size:17px;font-weight:bold;fill:#FFFFFF}
.t-sub{font-size:15px;fill:#5A6169}
.t-subw{font-size:15px;fill:#FFFFFF}
.t-s{font-size:15px;fill:#5A6169}
.t-rd{font-size:17px;fill:#23272B}
.t-line{stroke:#E8761F;stroke-width:2.5;fill:none}
.t-dash{stroke:#5A6169;stroke-width:2;stroke-dasharray:8 6;fill:none}
.sym{fill:#E8761F;stroke:#B8560F;stroke-width:2}
</style>
<defs>
<marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#E8761F"/></marker>
</defs>
<rect x="0" y="0" width="1500" height="700" fill="#FFFFFF"/>

<!-- ============ 风流断面 ============ -->
<rect x="56" y="110" width="200" height="160" rx="8" fill="#F5F6F7" stroke="#C9CED3" stroke-width="2"/>
<text class="t-title" x="156" y="142" text-anchor="middle">风流断面</text>
<path d="M 76 156 H 236" stroke="#C9CED3" stroke-width="1.5" fill="none"/>
<path class="sym" d="M 105 182 L 115 192 L 105 202 L 95 192 Z"/>
<path class="sym" d="M 145 182 L 155 192 L 145 202 L 135 192 Z"/>
<path class="sym" d="M 185 182 L 195 192 L 185 202 L 175 192 Z"/>
<path class="sym" d="M 225 182 L 235 192 L 225 202 L 215 192 Z"/>
<text class="t-s" x="156" y="230" text-anchor="middle">温度 · 湿度</text>
<text class="t-s" x="156" y="252" text-anchor="middle">CO₂ / SO₂</text>
<path class="t-dash" d="M 156 270 V 330"/>

<!-- ============ 综采工作面 + 200 m 范围 ============ -->
<text class="t-main" x="360" y="74" text-anchor="middle">综采工作面</text>
<rect x="304" y="100" width="112" height="200" rx="6" fill="#FBE9DA" stroke="#E8761F" stroke-width="2"/>
<rect x="330" y="86" width="60" height="244" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
<path d="M 282 100 V 300 M 272 100 H 292 M 272 300 H 292" stroke="#E8761F" stroke-width="2" fill="none"/>
<text class="t-main" x="276" y="94" text-anchor="end">200 m</text>

<circle class="sym" cx="360" cy="115" r="8"/>
<circle class="sym" cx="360" cy="145" r="8"/>
<circle class="sym" cx="360" cy="175" r="8"/>
<circle class="sym" cx="360" cy="205" r="8"/>
<circle class="sym" cx="360" cy="235" r="8"/>
<circle class="sym" cx="360" cy="265" r="8"/>
<circle class="sym" cx="360" cy="295" r="8"/>

<path d="M 386 145 H 424" stroke="#C9CED3" stroke-width="1.5" fill="none"/>
<text class="t-s" x="430" y="151">测点间距 1.5 m</text>
<text class="t-main" x="430" y="268">中部 200 m 范围</text>

<!-- ============ 回采巷道 ============ -->
<rect x="60" y="330" width="1340" height="60" rx="4" fill="#C9CED3" stroke="#3A3F45" stroke-width="2"/>
<text class="t-main" x="96" y="367">回采巷道</text>

<rect class="sym" x="230" y="350" width="20" height="20"/>
<rect class="sym" x="470" y="350" width="20" height="20"/>
<rect class="sym" x="710" y="350" width="20" height="20"/>
<rect class="sym" x="950" y="350" width="20" height="20"/>
<path d="M 240 390 V 402 M 480 390 V 402 M 720 390 V 402 M 960 390 V 402" stroke="#5A6169" stroke-width="2" fill="none"/>
<text class="t-s" x="240" y="424" text-anchor="middle">0 m</text>
<text class="t-s" x="480" y="424" text-anchor="middle">50 m</text>
<text class="t-s" x="720" y="424" text-anchor="middle">100 m</text>
<text class="t-s" x="960" y="424" text-anchor="middle">150 m</text>
<text class="t-s" x="1400" y="424" text-anchor="end">锚杆载荷测站：每 50 m 布设一个</text>

<path class="t-line" d="M 500 310 H 822" marker-end="url(#arw)"/>
<text class="t-main" x="661" y="296" text-anchor="middle">巷道走向</text>

<!-- ============ 岩溶发育区 ============ -->
<ellipse cx="1080" cy="190" rx="185" ry="118" fill="none" stroke="#E8761F" stroke-width="2.5" stroke-dasharray="10 7"/>
<text class="t-title" x="1080" y="116" text-anchor="middle">岩溶发育区</text>
<path d="M 1000 156 V 262" stroke="#5A6169" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
<path class="sym" d="M 1000 134 L 1011 156 L 989 156 Z"/>
<path class="sym" d="M 1000 262 L 1011 284 L 989 284 Z"/>
<text class="t-s" x="1024" y="198">顶板钻孔承压水通道</text>
<text class="t-s" x="1024" y="222">水压 + 震动参量</text>

<!-- ============ 底部链路 ============ -->
<rect x="40" y="530" width="150" height="68" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
<text class="t-main" x="115" y="560" text-anchor="middle">四组合计</text>
<text class="t-sub" x="115" y="582" text-anchor="middle">11 个以上测点</text>

<rect x="232" y="530" width="150" height="68" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
<text class="t-main" x="307" y="560" text-anchor="middle">RS485</text>
<text class="t-sub" x="307" y="582" text-anchor="middle">总线就地汇聚</text>

<rect x="424" y="530" width="150" height="68" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
<text class="t-main" x="499" y="560" text-anchor="middle">巷道口</text>
<text class="t-sub" x="499" y="582" text-anchor="middle">汇聚节点</text>

<rect x="616" y="530" width="150" height="68" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
<text class="t-main" x="691" y="560" text-anchor="middle">LoRa</text>
<text class="t-sub" x="691" y="582" text-anchor="middle">无线多跳回传</text>

<rect x="808" y="530" width="150" height="68" rx="6" fill="#E8761F" stroke="#B8560F" stroke-width="2"/>
<text class="t-mainw" x="883" y="560" text-anchor="middle">边缘网关</text>
<text class="t-subw" x="883" y="582" text-anchor="middle">上传监测平台</text>

<path class="t-line" d="M 192 562 H 226" marker-end="url(#arw)"/>
<path class="t-line" d="M 384 562 H 418" marker-end="url(#arw)"/>
<path class="t-line" d="M 576 562 H 610" marker-end="url(#arw)"/>
<path class="t-line" d="M 768 562 H 802" marker-end="url(#arw)"/>

<!-- ============ 图例 ============ -->
<rect x="990" y="470" width="470" height="190" rx="8" fill="#F5F6F7" stroke="#C9CED3" stroke-width="2"/>
<text class="t-title" x="1225" y="502" text-anchor="middle">图例</text>
<path d="M 1010 514 H 1440" stroke="#C9CED3" stroke-width="1.5" fill="none"/>

<circle class="sym" cx="1030" cy="539" r="9"/>
<text class="t-rd" x="1062" y="545">支架阻力 / 顶板位移</text>

<rect class="sym" x="1021" y="563" width="18" height="18"/>
<text class="t-rd" x="1062" y="578">锚杆载荷</text>

<path class="sym" d="M 1030 594 L 1040 614 L 1020 614 Z"/>
<text class="t-rd" x="1062" y="611">岩溶水压 / 震动参量</text>

<path class="sym" d="M 1030 628 L 1040 638 L 1030 648 L 1020 638 Z"/>
<text class="t-rd" x="1062" y="644">环境量（温度·湿度·CO₂/SO₂）</text>
</svg>