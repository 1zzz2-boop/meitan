<text class="t-sub" x="1217" y="375" text-anchor="middle">超限即时报警</text>

<path class="t-line" d="M 1217 415 L 1217 458" marker-end="url(#arw)"/>

<rect x="1086" y="462" width="262" height="118" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
