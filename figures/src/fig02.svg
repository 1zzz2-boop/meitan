<text class="t-subw" x="872" y="438" text-anchor="middle">协议转换 · 断点续传</text>

<path class="t-line" d="M 872 460 L 872 488" marker-end="url(#arw)"/>

<rect x="741" y="492" width="262" height="88" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
