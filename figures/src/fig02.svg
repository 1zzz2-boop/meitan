<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<style>
text{font-family:"Microsoft YaHei",SimHei,sans-serif}
.t-head{font-size:22px;font-weight:bold;fill:#FFFFFF}
.t-main{font-size:18px;font-weight:bold;fill:#23272B}
.t-mainw{font-size:18px;font-weight:bold;fill:#FFFFFF}
.t-sub{font-size:15px;fill:#5A6169}
.t-subw{font-size:15px;fill:#FFFFFF}
.t-note{font-size:17px;fill:#5A6169}
.t-ch{font-size:15px;fill:#5A6169}
.t-line{stroke:#E8761F;stroke-width:2.5;fill:none}
</style>
<defs>
<marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#E8761F"/></marker>
<marker id="arwg" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#5A6169"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="700" fill="#FFFFFF"/>

<!-- ================= 段1 感知单元 ================= -->
<rect x="36" y="68" width="294" height="528" rx="8" fill="#F5F6F7" stroke="#C9CED3" stroke-width="2"/>
