<rect x="52" y="134" width="262" height="64" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
<text class="t-main" x="183" y="160" text-anchor="middle">薄膜压力</text>
<text class="t-sub" x="183" y="182" text-anchor="middle">支架阻力</text>

<rect x="52" y="210" width="262" height="64" rx="6" fill="#EDEFF1" stroke="#C9CED3" stroke-width="2"/>
